name: 'Terraform Deploy EC2Nginx'

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # Required for requesting the OIDC JWT token
      contents: read    # Required for checking out code

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS via OIDC Role
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::702828429997:role/GitHubActionsTerraformEC2Role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      # 3. Setup Terraform CLI version
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      # 4. Initialize Terraform workspace
      - name: Terraform Init
        run: terraform init

      # 5. Plan deployment changes
      - name: Terraform Plan
        run: terraform plan

      # 6. Apply infrastructure changes
      - name: Terraform Apply
        run: terraform apply -auto-approve
